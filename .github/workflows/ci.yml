name: ACC CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: ESLint (TypeScript)
        run: pnpm run lint
      - name: Prettier (TypeScript)
        run: pnpm run formatcheck
      - name: TypeScript language server available
        run: pnpm exec typescript-language-server --version
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Package installable DSH plugin
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
      - name: Publish installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-auto-code-correct-plugin
          path: dist/*.tgz
          if-no-files-found: error
